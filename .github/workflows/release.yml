name: Release

# A vX.Y.Z tag is a release; docs/release.md says what each job does and how to run each step by hand.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Existing vX.Y.Z tag to build again'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.ref || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_REF: ${{ inputs.ref || github.ref_name }}

jobs:
  # Nothing downstream may publish a version, closure or file set the tree does not agree on.
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Qualified, so a branch that shares the tag's name can never be what is checked out.
          ref: ${{ inputs.ref && format('refs/tags/{0}', inputs.ref) || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - id: check
        name: The tag, Cargo.toml and both PKGBUILDs agree
        run: |
          set -euo pipefail
          ref="$RELEASE_REF"
          [[ "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::'$ref' is not a vX.Y.Z tag; releases build exact version tags only"; exit 1; }
          version="${ref#v}"
          sha=$(git rev-parse -q --verify "refs/tags/$ref^{commit}") \
            || { echo "::error::tag '$ref' does not exist"; exit 1; }
          [ "$(git rev-parse HEAD)" = "$sha" ] \
            || { echo "::error::the checkout is not the commit tag '$ref' names"; exit 1; }

          fail=0
          check() { # check <what> <actual> <expected>
            if [ "$2" != "$3" ]; then
              echo "::error::$1 is '$2' but the tag says '$3'"; fail=1
            fi
          }
          # Sample input: Cargo.toml line `version = "0.3.3"`.
          check "Cargo.toml version" \
            "$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)" "$version"
          # Sample input: PKGBUILD line `pkgver=0.3.3`, the same in both files.
          check "PKGBUILD pkgver" \
            "$(grep -m1 '^pkgver=' PKGBUILD | cut -d= -f2)" "$version"
          check "packaging/flea-bin/PKGBUILD pkgver" \
            "$(grep -m1 '^pkgver=' packaging/flea-bin/PKGBUILD | cut -d= -f2)" "$version"

          # Both files are this tree's own, so sourcing them for their closure is what makepkg does.
          closure() {
            # ./ anchors the file: a bare name is looked up on PATH first, where a PKGBUILD executable would win.
            bash -c 'source "./$1"; printf "%s\n" "depends:" "${depends[@]}" "optdepends:" "${optdepends[@]}"' _ "$1"
          }
          if ! diff <(closure PKGBUILD) <(closure packaging/flea-bin/PKGBUILD); then
            echo "::error::packaging/flea-bin/PKGBUILD's depends or optdepends differ from PKGBUILD's"; fail=1
          fi

          # Sample input: from `package() {` to the next line that is exactly `}`, minus the cd and binary lines.
          body() { sed -n '/^package() {/,/^}/p' "$1" | grep -v -E '^  cd |/usr/bin/flea"$'; }
          if ! diff <(body PKGBUILD) <(body packaging/flea-bin/PKGBUILD); then
            echo "::error::packaging/flea-bin/PKGBUILD's package() has drifted from PKGBUILD's"; fail=1
          fi

          [ "$fail" -eq 0 ] || exit 1
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "verified $ref"

  # One native runner per architecture, so the aarch64 binary is one its own test suite ran on.
  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      # A master commit, because dtolnay recreates the version branches and orphans a commit pinned from one.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: stable

      # bsdtar, gio and libvulkan.so.1 are what the suite calls beyond coreutils; it must run as a non-root user.
      - name: Install what the test suite shells out to
        run: |
          set -eu
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y -o Acquire::Retries=3 libarchive-tools libglib2.0-bin libvulkan1

      # The Rust half of check(); tests/js.sh and tests/keymap-gen.sh need qml6 and stay with the Arch build.
      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Stage the flea-bin tarball
        run: packaging/flea-bin-tarball target/release/flea "$VERSION" "$ARCH" dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flea-bin-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # Creates the release or attaches to one; it never replaces a published tarball, whose checksum the AUR pins.
  release:
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: The artifacts still match their sidecars
        run: cd dist && sha256sum -c ./*.sha256

      - name: Create the release or attach to it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$RELEASE_REF"
          # Read at use time, not at verify, so a newer tag pushed mid-run is seen; the remote prints "<sha>\trefs/tags/v0.3.3".
          newest=$(git ls-remote --tags --refs origin 'v*' | cut -f2 | cut -d/ -f3 | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          latest=false; [ "$tag" = "$newest" ] && latest=true
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Sample input: one published asset name per line, e.g. "flea-v0.3.3-linux-x86_64.tar.gz".
            published=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            for asset in dist/*; do
              if grep -qxF "$(basename "$asset")" <<< "$published"; then
                echo "::error::$tag already carries $(basename "$asset"), whose checksum the AUR pins; delete it from the release by hand to replace it on purpose"
                exit 1
              fi
            done
            gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY"
            echo "attached the flea-bin tarballs and sidecars to the existing $tag release"
          else
            notes="docs/release-notes-$VERSION.md"
            if [ -f "$notes" ]; then
              gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --title "$tag" --verify-tag --latest="$latest" --notes-file "$notes"
            else
              gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --title "$tag" --verify-tag --latest="$latest" --generate-notes
            fi
            echo "created the $tag release"
          fi

  # The PKGBUILD is proved against the assets just published before any push; the push needs AUR_SSH_KEY.
  publish-aur:
    needs: [verify, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # The tree's PKGBUILD says SKIP so that a version bump is one line; the AUR gets real hashes.
      - name: Pin the checksums
        run: |
          set -euo pipefail
          # Sample input: a sha256sum sidecar line `<64 hex>  flea-v0.3.3-linux-x86_64.tar.gz`.
          x86=$(cut -d' ' -f1 "dist/flea-v$VERSION-linux-x86_64.tar.gz.sha256")
          arm=$(cut -d' ' -f1 "dist/flea-v$VERSION-linux-aarch64.tar.gz.sha256")
          [[ "$x86" =~ ^[0-9a-f]{64}$ && "$arm" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::malformed sidecar"; exit 1; }
          sed -i "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('$x86')/" packaging/flea-bin/PKGBUILD
          sed -i "s/^sha256sums_aarch64=.*/sha256sums_aarch64=('$arm')/" packaging/flea-bin/PKGBUILD
          if grep -q "'SKIP'" packaging/flea-bin/PKGBUILD; then
            echo "::error::a SKIP survived pinning; the AUR never receives one"; exit 1
          fi
          grep '^sha256sums_' packaging/flea-bin/PKGBUILD

      - name: Prove the PKGBUILD against the published release
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/packaging/flea-bin/PKGBUILD:/pkg/PKGBUILD:ro" -e "VERSION=$VERSION" archlinux:base-devel bash -euo pipefail -c '
            useradd -m build
            mkdir /home/build/pkg && cp /pkg/PKGBUILD /home/build/pkg/ && chown -R build /home/build/pkg
            cd /home/build/pkg
            # makepkg refuses root; package() only installs files, so an aarch64 makepkg.conf builds it on this host.
            sed "s/^CARCH=.*/CARCH=\"aarch64\"/; s/^CHOST=.*/CHOST=\"aarch64-unknown-linux-gnu\"/" /etc/makepkg.conf > /home/build/makepkg-aarch64.conf
            su build -c "makepkg --nodeps --noconfirm --clean"
            su build -c "makepkg --nodeps --noconfirm --clean --config /home/build/makepkg-aarch64.conf"
            su build -c "makepkg --printsrcinfo" | tee .SRCINFO
            list() { bsdtar -tf "$1" | grep -v "^\." | sort; }
            list "flea-bin-$VERSION-1-x86_64.pkg.tar.zst" > x86_64.list
            list "flea-bin-$VERSION-1-aarch64.pkg.tar.zst" > aarch64.list
            diff x86_64.list aarch64.list
            grep -qx "usr/bin/flea" x86_64.list
            grep -qx "usr/share/flea/ui/boot/shell.qml" x86_64.list
            echo "flea-bin $VERSION packages $(wc -l < x86_64.list) paths on both architectures"
          '

      - id: aur
        name: Read the maintainer and decide whether the AUR push runs
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          set -euo pipefail
          # Read at use time, not at verify, so a newer tag pushed mid-run is seen; the remote prints "<sha>\trefs/tags/v0.3.3".
          newest=$(git ls-remote --tags --refs origin 'v*' | cut -f2 | cut -d/ -f3 | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          # Sample input: "# Maintainer: GM <gianmarcomorales@icloud.com>", which also authors the AUR commit.
          line=$(sed -n 's/^# Maintainer: //p' packaging/flea-bin/PKGBUILD | head -n1)
          maintainer='^([^<>]+) <([^<>@ ]+@[^<>@ ]+)>$'
          [[ "$line" =~ $maintainer ]] \
            || { echo "::error::'$line' is not '# Maintainer: Name <email>' in packaging/flea-bin/PKGBUILD"; exit 1; }
          echo "name=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "email=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=AUR push skipped::the AUR_SSH_KEY secret is not set; docs/release.md says how to set it up once"
          elif [ "$RELEASE_REF" != "$newest" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=AUR push skipped::$RELEASE_REF is not the newest release tag, and the AUR keeps the newer version"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi

      # Pinned to a commit because it is handed the AUR private key; it regenerates .SRCINFO and pushes over SSH.
      - name: Push flea-bin to the AUR
        if: steps.aur.outputs.push == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: flea-bin
          pkgbuild: ./packaging/flea-bin/PKGBUILD
          commit_username: ${{ steps.aur.outputs.name }}
          commit_email: ${{ steps.aur.outputs.email }}
          ssh_private_key: ${{ secrets.AUR_SSH_KEY }}
          commit_message: flea-bin ${{ env.RELEASE_REF }}
          ssh_keyscan_types: rsa,ecdsa,ed25519
          force_push: 'false'
